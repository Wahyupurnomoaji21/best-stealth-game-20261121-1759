<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Midnight Stacks — Stealth di Arsip Tengah Malam</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0a0705;
    overflow: hidden;
    font-family: Georgia, 'Times New Roman', serif;
  }
  #wrap {
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 40%, #171009 0%, #070403 70%);
  }
  canvas {
    width: min(100vw, calc(100vh * 1.6));
    height: min(100vh, calc(100vw / 1.6));
    image-rendering: auto;
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.9), 0 0 120px rgba(255, 170, 60, 0.07);
    border: 1px solid #2a1c10;
    background: #000;
    cursor: crosshair;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="800"></canvas>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
